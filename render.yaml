services:
  - type: web
    name: barbara-pos
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: barbara-pos
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSET_URL
        fromService:
          type: web
          name: barbara-pos
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: barbara-pos-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: AUTORUN_ENABLED
        value: "true"
      - key: AUTORUN_LARAVEL_ROUTE_CACHE
        value: "false"

databases:
  - name: barbara-pos-db
    plan: free
    region: frankfurt
